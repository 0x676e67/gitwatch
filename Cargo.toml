[package]
name = "gitwatch"
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 AND OFL-1.1"
description = "Desktop Git watching, workspace backups and synchronization"
repository = "https://github.com/0x676e67/gitwatch"
readme = "README.md"
keywords = ["git", "backup", "watch", "workspace"]
categories = ["filesystem"]
default-run = "gitwatch"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[[bin]]
name = "gitwatch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
dunce = "1"
fs2 = "0.4"
globset = "0.4"
notify = "8.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
semver = "1"
self-replace = "1.5"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
sys-locale = "0.3"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "links", "x11", "wayland"] }
rfd = "0.17"
tray-icon = { version = "0.26.0", default-features = false, features = ["ksni"] }
