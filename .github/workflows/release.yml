name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev
      - run: rustup update stable --no-self-update
      - run: cargo +stable build --locked --release --all-features
      - run: cargo +stable test --locked --all-features
      - name: Package binaries
        shell: bash
        run: |
          mkdir dist
          cp LICENSE README.md dist/
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp target/release/gitwatch.exe target/release/gitwatch-desktop.exe dist/
          else
            cp target/release/gitwatch target/release/gitwatch-desktop dist/
          fi
          tar -czf "gitwatch-$RUNNER_OS-$RUNNER_ARCH.tar.gz" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: gitwatch-${{ runner.os }}-${{ runner.arch }}
          path: gitwatch-*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gitwatch-*
          merge-multiple: true
          path: artifacts
      - name: Checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --draft --verify-tag --title "$RELEASE_TAG" --notes "CLI, TUI and desktop binaries. Git must be installed separately."
