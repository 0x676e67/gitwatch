name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected version tag (false runs a build rehearsal)
        type: boolean
        default: false
      publish_crate:
        description: Publish to crates.io using Trusted Publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version and release source
        id: version
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        shell: python
        run: |
          import os
          import subprocess
          import tomllib

          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['package']['version']
          tag = f'v{version}'
          ref = os.environ['GITHUB_REF']
          publish = os.environ['PUBLISH'] == 'true'
          if ref.startswith('refs/tags/') or publish:
              if ref != f'refs/tags/{tag}':
                  raise SystemExit(f'Select tag {tag}; it must match Cargo.toml')
          if publish:
              subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\npublish={str(publish).lower()}\n')

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev
      - name: Stable toolchain
        run: rustup update stable --no-self-update
      - name: Build CLI, TUI and desktop
        run: cargo +stable build --locked --release --all-features --target ${{ matrix.target }}
      - name: Check packaged CLI
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          "target/$TARGET/release/gitwatch$suffix" --version
          "target/$TARGET/release/gitwatch$suffix" --help
      - name: Package binaries
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        shell: python
        run: |
          import os
          import pathlib
          import tarfile
          import zipfile

          target = os.environ['TARGET']
          name = f"gitwatch-{os.environ['RELEASE_TAG']}-{target}"
          windows = os.environ['RUNNER_OS'] == 'Windows'
          suffix = '.exe' if windows else ''
          files = [pathlib.Path('LICENSE'), pathlib.Path('README.md')]
          files += [pathlib.Path('target', target, 'release', binary + suffix)
                    for binary in ['gitwatch', 'gitwatch-desktop']]
          pathlib.Path('dist').mkdir()
          if windows:
              with zipfile.ZipFile(f'dist/{name}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  for file in files:
                      archive.write(file, f'{name}/{file.name}')
          else:
              with tarfile.open(f'dist/{name}.tar.gz', 'w:gz') as archive:
                  for file in files:
                      archive.add(file, arcname=f'{name}/{file.name}')
      - uses: actions/upload-artifact@v7
        with:
          name: gitwatch-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  crate:
    needs: [version, checks, build]
    if: needs.version.outputs.publish == 'true' && (github.event_name == 'push' || inputs.publish_crate)
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - name: Check published version
        id: registry
        shell: python
        run: |
          import json
          import os
          import tomllib
          import urllib.error
          import urllib.request

          with open('Cargo.toml', 'rb') as manifest:
              package = tomllib.load(manifest)['package']
          request = urllib.request.Request(
              f"https://crates.io/api/v1/crates/{package['name']}",
              headers={'User-Agent': 'gitwatch-release (https://github.com/0x676e67/gitwatch)'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  crate = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  raise SystemExit('Publish the first version locally, then configure Trusted Publishing on crates.io.')
              raise
          if crate['crate']['repository'] != package['repository']:
              raise SystemExit('The crates.io repository does not match Cargo.toml')
          published = any(version['num'] == package['version'] for version in crate['versions'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'published={str(published).lower()}\n')
      - name: Verify crate before authentication
        if: steps.registry.outputs.published != 'true'
        run: cargo +stable publish --locked --dry-run
      - name: Authenticate with crates.io
        if: steps.registry.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate
        if: steps.registry.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +stable publish --locked

  github-release:
    needs: [version, checks, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gitwatch-*
          merge-multiple: true
          path: artifacts
      - name: Checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists; its assets will not be replaced.'
            exit 1
          fi
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "$RELEASE_TAG" \
            --generate-notes "${prerelease[@]}"
